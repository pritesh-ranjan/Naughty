name: Build and Test Naughty

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew and build script
      run: |
        chmod +x gradlew
        chmod +x build_release.sh

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Copy Release APK with Version
      run: |
        VERSION_NAME=$(grep 'VERSION_NAME=' version.properties | cut -d'=' -f2)
        cp app/build/outputs/apk/release/app-release.apk "Naughty-v${VERSION_NAME}-release.apk"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: naughty-release-apk
        path: Naughty-v*-release.apk
        retention-days: 14
